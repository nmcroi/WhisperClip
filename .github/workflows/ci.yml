# CI voor Whisper Clipboard v2.
#
# Core bevat een Objective-C-vangnet en Apple Security-API's. Test Core daarom
# op dezelfde ondersteunde Apple-runner als de apps; de Linux-job kon hierdoor
# nooit compileren. Concurrency-cancel en de SPM-cache beperken runnergebruik.
#
# De E2E-smoketests (WC_E2E=1) en alles wat een echte mic/iCloud/mailaccount
# nodig heeft draaien hier bewust niet.
name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apps-macos:
    name: Mac + iOS (Xcode)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Selecteer Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then
            sudo xcode-select -s "$XCODE/Contents/Developer"
          fi
          xcodebuild -version

      - name: Installeer XcodeGen
        run: brew install xcodegen

      - name: Genereer Xcode-project
        run: xcodegen generate
        working-directory: v2

      - name: SPM-cache
        uses: actions/cache@v4
        with:
          path: v2/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('v2/project.yml', 'v2/Packages/**/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Core-tests (macOS)
        working-directory: v2
        run: swift test --package-path Packages/Core

      # -quiet in plaats van "| tail": zo kan een compileerfout nooit buiten
      # het zichtbare log vallen, terwijl de succes-output kort blijft.
      - name: Mac-app — build + tests
        working-directory: v2
        run: |
          xcodebuild test \
            -project WhisperClipboard.xcodeproj \
            -scheme WhisperClipboard \
            -destination 'platform=macOS' \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: iOS-app — build (Simulator)
        working-directory: v2
        run: |
          xcodebuild build \
            -project WhisperClipboard.xcodeproj \
            -scheme WhisperClipboardiOS \
            -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
